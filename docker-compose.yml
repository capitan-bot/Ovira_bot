services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      start_period: 20s
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
    command: sh -c "alembic upgrade head && python -m database.seed"
    restart: "no"

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      migrate: {condition: service_completed_successfully}
    volumes:
      - ./storage:/app/storage
    command: python -m bot.main

  # api / workers services are added in later stages

volumes:
  pgdata:
